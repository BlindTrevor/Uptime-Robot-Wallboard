<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DEMO - Status Wallboard with Paused Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <style>
    :root {
      --bg: #0b1220;
      --card: #121c33;
      --border: #213155;
      --accent: #3a569c;
      --text: #e8eefc;
      --subtle: #9fb0d1;
      --muted: #b9c6e2;
      --ok: #3ad29f;
      --warn: #ffd27a;
      --bad: #ff6b6b;
      --warning-bg: #3b2a1a;
      --warning-border: #5e4123;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      padding: 1rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg); color: var(--text);
    }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 1rem; }
    h1 { margin: 0; font-size: 1.25rem; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 10px; border-radius: 999px; font-size: 0.85rem;
      border: 1px solid var(--border);
    }
    .pill.ok { background: #163327; color: #8af0c9; border-color: #184836; }
    .pill.paused { background: var(--warning-bg); color: var(--warn); border-color: var(--warning-border); }
    .controls { margin-bottom: 0.8rem; display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      background: var(--border); color: var(--text);
      border: 1px solid var(--accent); border-radius: 8px;
      padding: 6px 10px; cursor: pointer; font-weight: 600;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    .card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 10px; 
      padding-bottom: 40px;
      position: relative;
      min-height: 120px;
    }
    .card.paused-card {
      background: var(--warning-bg);
      border-color: var(--warning-border);
    }
    .response-time-graph {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%;
      opacity: 0.25;
      pointer-events: none;
    }
    .name { font-weight: 700; font-size: 1.05rem; margin-bottom: 6px; position: relative; z-index: 1; }
    .status { margin-top: 8px; font-weight: 800; display: flex; align-items: center; gap: 6px; position: relative; z-index: 1; }
    .status.up { color: var(--ok); }
    .status.paused { color: var(--warn); }
    .kv { font-size: 0.86rem; color: var(--muted); margin-top: 6px; position: relative; z-index: 1; }
    .small { font-size: 0.78rem; color: var(--subtle); margin-top: 6px; position: relative; z-index: 1; }
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      position: absolute;
      bottom: 8px;
      left: 10px;
      right: 10px;
      z-index: 2;
    }
    .tag-pill {
      display: inline-flex;
      padding: 3px 10px;
      margin: 2px 4px 2px 0;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid;
      opacity: 0.7;
    }
    .footer { position: fixed; left: 12px; bottom: 8px; color: var(--subtle); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>ACME Corp - Service Status (Paused Monitor Example)</h1>
    <div>
      <span class="pill ok"><i class="fas fa-check-circle"></i> 7 Up</span>
      <span class="pill paused"><i class="fas fa-pause-circle"></i> 1 Paused</span>
    </div>
  </header>

  <div class="controls">
    <button>Show All</button>
    <button style="background: var(--accent);">Show Paused</button>
    <button>Hide Tags</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">Demo Data Only • Not Real Services</div>

  <script>
    const monitors = [
      {
        name: "Example Staging Server",
        url: "https://staging.example.com",
        status: "paused",
        uptime: 99.85,
        responseTime: 245,
        tags: ["staging", "paused-maintenance"]
      },
      {
        name: "Example Website",
        url: "https://example.com",
        status: "up",
        uptime: 99.98,
        responseTime: 245,
        tags: ["production", "critical"]
      },
      {
        name: "Sample API Server",
        url: "https://api.example.com",
        status: "up",
        uptime: 99.95,
        responseTime: 189,
        tags: ["production", "api"]
      },
      {
        name: "Demo Database",
        url: "db.example.internal",
        status: "up",
        uptime: 100.0,
        responseTime: 15,
        tags: ["production", "database", "critical"]
      },
      {
        name: "Test CDN Endpoint",
        url: "https://cdn.example.com",
        status: "up",
        uptime: 99.99,
        responseTime: 98,
        tags: ["production", "cdn"]
      },
      {
        name: "Sample Authentication Service",
        url: "https://auth.example.com",
        status: "up",
        uptime: 99.97,
        responseTime: 156,
        tags: ["production", "critical"]
      },
      {
        name: "Example File Storage",
        url: "https://files.example.com",
        status: "up",
        uptime: 99.94,
        responseTime: 278,
        tags: ["production", "storage"]
      },
      {
        name: "Demo Email Service",
        url: "mail.example.internal",
        status: "up",
        uptime: 99.92,
        responseTime: 342,
        tags: ["production", "email"]
      }
    ];

    function hashStringToColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = hash % 360;
      return `hsl(${hue}, 65%, 55%)`;
    }

    function generateResponseTimeData(base) {
      const data = [];
      for (let i = 0; i < 60; i++) {
        const variance = Math.sin(i / 5) * 0.3 + Math.random() * 0.4 - 0.2;
        data.push(Math.max(10, base * (1 + variance)));
      }
      return data;
    }

    function drawGraph(canvas, data, color) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      
      const min = Math.min(...data), max = Math.max(...data);
      const range = max - min || 1;
      
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      
      data.forEach((val, i) => {
        const x = (i / (data.length - 1)) * w;
        const y = h - ((val - min) / range) * h;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      
      ctx.stroke();
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, color + '40');
      grad.addColorStop(1, color + '00');
      ctx.fillStyle = grad;
      ctx.fill();
    }

    const grid = document.getElementById('grid');
    monitors.forEach(m => {
      const card = document.createElement('div');
      card.className = 'card';
      if (m.status === 'paused') card.className += ' paused-card';
      
      const canvas = document.createElement('canvas');
      canvas.className = 'response-time-graph';
      canvas.width = 800;
      canvas.height = 200;
      const data = generateResponseTimeData(m.responseTime);
      const color = m.status === 'paused' ? '#ffd27a' : '#3ad29f';
      drawGraph(canvas, data, color);
      card.appendChild(canvas);
      
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = m.name;
      card.appendChild(name);
      
      const url = document.createElement('div');
      url.className = 'small';
      url.textContent = m.url;
      card.appendChild(url);
      
      const status = document.createElement('div');
      status.className = `status ${m.status}`;
      const icon = m.status === 'paused' ? 'fa-pause-circle' : 'fa-check-circle';
      const text = m.status === 'paused' ? 'PAUSED' : 'OPERATIONAL';
      status.innerHTML = `<i class="fas ${icon}"></i> <span>${text}</span>`;
      card.appendChild(status);
      
      const uptime = document.createElement('div');
      uptime.className = 'kv';
      uptime.textContent = `Uptime: ${m.uptime}%`;
      card.appendChild(uptime);
      
      const rt = document.createElement('div');
      rt.className = 'kv';
      rt.textContent = `Response Time: ${m.responseTime}ms`;
      card.appendChild(rt);
      
      const tagsContainer = document.createElement('div');
      tagsContainer.className = 'tags-container';
      m.tags.forEach(tag => {
        const pill = document.createElement('span');
        pill.className = 'tag-pill';
        const color = hashStringToColor(tag);
        pill.style.backgroundColor = color + '30';
        pill.style.borderColor = color;
        pill.style.color = color;
        pill.textContent = tag;
        tagsContainer.appendChild(pill);
      });
      card.appendChild(tagsContainer);
      
      grid.appendChild(card);
    });
  </script>
</body>
</html>
